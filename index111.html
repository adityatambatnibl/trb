<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRB Geometry & Rating Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --paper: #EFEDE3;
  --ink: #1C2B3A;
  --steel: #2E5372;
  --line: #B6B09B;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background-color: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
@media (max-width: 768px) { .wrap { grid-template-columns: 1fr; } }

.panel { background: #fff; border: 1px solid var(--ink); padding: 20px; }
h2 { font-size: 1.1rem; margin-top: 0; border-bottom: 2px solid var(--steel); padding-bottom: 5px; color: var(--steel); text-transform: uppercase; }
h3 { font-size: 0.85rem; background: var(--paper); padding: 5px 10px; border-left: 3px solid var(--steel); margin: 15px 0 10px 0; text-transform: uppercase; }

.field { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.field label { font-weight: 500; font-size: 0.85rem; }
input { width: 120px; font-family: var(--mono); font-size: 0.85rem; padding: 4px; border: 1px solid var(--line); }

button { width: 100%; background: var(--steel); color: #fff; border: none; padding: 12px; font-weight: bold; cursor: pointer; margin-top: 15px; }
button:hover { background: var(--ink); }

table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-family: var(--mono); font-size: 0.8rem; }
th { text-align: left; background: var(--paper); padding: 8px; border: 1px solid var(--line); width: 35%; }
td { padding: 8px; border: 1px solid var(--line); }
.form { color: #666; font-size: 0.75rem; background: #faf9f5; width: 40%; }
.val { font-weight: 600; color: var(--steel); width: 25%; white-space: nowrap; }
</style>
</head>
<body>

<div class="wrap">
  <!-- INPUT SECTION -->
  <div class="panel">
    <h2>TRB Inputs</h2>
    <div class="field"><label>Bearing No.</label><input type="text" id="bNo" value="30210"></div>
    <div class="field"><label>Bearing O.D. (D)</label><input type="number" id="D" value="90"></div>
    <div class="field"><label>Bearing I.D. (d)</label><input type="number" id="d" value="50"></div>
    <div class="field"><label>Bearing Width (W/T)</label><input type="number" id="W" value="21.75"></div>
    <hr style="border:0; border-top:1px dashed var(--line); margin: 15px 0;">
    <div class="field"><label>Roller Dia. (Dw)</label><input type="number" id="Dw" value="10.0"></div>
    <div class="field"><label>Roller Length (Lwe)</label><input type="number" id="Lwe" value="12.0"></div>
    <div class="field"><label>No. of Rollers (Z)</label><input type="number" id="Z" value="19"></div>
    <div class="field"><label>Cup Angle (α)&deg;</label><input type="number" id="alpha" value="15.9"></div>
    <div class="field"><label>Roller Half Angle (δ)&deg;</label><input type="number" id="delta" value="1.5"></div>
    <button onclick="calc()">Calculate TRB Output</button>
  </div>

  <!-- OUTPUT SECTION -->
  <div class="panel" id="out">
    <h2>TRB Outputs (Calculated)</h2>
    <div id="results" style="color: #666; font-style: italic;">Press calculate to generate data...</div>
  </div>
</div>

<script>
function deg2rad(deg) { return deg * (Math.PI / 180); }

function calc() {
  const D = parseFloat(document.getElementById('D').value);
  const d = parseFloat(document.getElementById('d').value);
  const W = parseFloat(document.getElementById('W').value);
  const Dw = parseFloat(document.getElementById('Dw').value);
  const Lwe = parseFloat(document.getElementById('Lwe').value);
  const Z = parseInt(document.getElementById('Z').value);
  const alpha = parseFloat(document.getElementById('alpha').value);
  const delta = parseFloat(document.getElementById('delta').value);

  const aRad = deg2rad(alpha);
  const dm = (D + d) / 2; // P.C.D equivalent

  // INNER (Cone)
  const beta = alpha - (2 * delta);
  const irDia = dm - (Dw * Math.cos(aRad)); 
  const innerOD = irDia + (Dw * Math.sin(aRad)); 

  // OUTER (Cup)
  const gro = alpha; 
  const orDia = dm + (Dw * Math.cos(aRad)); 
  const outerID = orDia - (Dw * Math.sin(aRad)); 

  // RETAINER (Approximations based on pitch dia dm)
  const rThick = 2.0; 
  const rdOD = dm + (Dw / 2) + rThick; 
  const rdID = dm - (Dw / 2) - rThick; 
  const rRadius = dm / 2; 

  // FACTORS 
  const e = 1.5 * Math.tan(aRad);
  const Y = 0.4 / Math.tan(aRad);
  const Y0 = 0.22 / Math.tan(aRad);

  // RATINGS 
  const C0 = 22 * Z * Lwe * Dw * Math.cos(aRad); 
  const C = 80 * Math.pow(Lwe * Math.cos(aRad), 7/9) * Math.pow(Z, 3/4) * Math.pow(Dw, 29/27); 

  let html = `
    <div style="font-family:var(--mono); font-size:0.75rem; margin-bottom: 10px;">Note: <b>d<sub>m</sub></b> (Mean Dia) = (D + d) / 2 = ${dm.toFixed(2)} mm</div>
    
    <h3>INNER (Cone)</h3>
    <table>
      <tr><th>ID (Inner OD approx)</th><td class="form">IR + Dw &middot; sin(α)</td><td class="val">${innerOD.toFixed(2)} mm</td></tr>
      <tr><th>gri (Cone Track Angle β)</th><td class="form">α - 2δ</td><td class="val">${beta.toFixed(2)}&deg;</td></tr>
      <tr><th>IR (Inner Track Dia)</th><td class="form">d<sub>m</sub> - Dw &middot; cos(α)</td><td class="val">${irDia.toFixed(2)} mm</td></tr>
    </table>

    <h3>OUTER (Cup)</h3>
    <table>
      <tr><th>od (Outer I.D. approx)</th><td class="form">OR - Dw &middot; sin(α)</td><td class="val">${outerID.toFixed(2)} mm</td></tr>
      <tr><th>gro (Outer Track Angle α)</th><td class="form">α (Input)</td><td class="val">${gro.toFixed(2)}&deg;</td></tr>
      <tr><th>OR (Outer Track Dia)</th><td class="form">d<sub>m</sub> + Dw &middot; cos(α)</td><td class="val">${orDia.toFixed(2)} mm</td></tr>
    </table>

    <h3>RETAINER (Cage - Geometrical Approx)</h3>
    <table>
      <tr><th>RD (Retainer OD)</th><td class="form">d<sub>m</sub> + (Dw / 2) + T</td><td class="val">${rdOD.toFixed(2)} mm</td></tr>
      <tr><th>Rd (Retainer ID)</th><td class="form">d<sub>m</sub> - (Dw / 2) - T</td><td class="val">${rdID.toFixed(2)} mm</td></tr>
      <tr><th>R (Retainer Mean Radius)</th><td class="form">d<sub>m</sub> / 2</td><td class="val">${rRadius.toFixed(2)} mm</td></tr>
      <tr><th>T (Retainer Thickness)</th><td class="form">Assumed Standard (2.0)</td><td class="val">${rThick.toFixed(2)} mm</td></tr>
    </table>

    <h3>FACTORS (TRB Equivalents to fb, bm, fc)</h3>
    <table>
      <tr><th>Limit Ratio (e)</th><td class="form">1.5 &middot; tan(α)</td><td class="val">${e.toFixed(3)}</td></tr>
      <tr><th>Axial Factor (Y)</th><td class="form">0.4 &middot; cot(α)</td><td class="val">${Y.toFixed(3)}</td></tr>
      <tr><th>Static Factor (Y₀)</th><td class="form">0.22 &middot; cot(α)</td><td class="val">${Y0.toFixed(3)}</td></tr>
    </table>

    <h3>RATINGS</h3>
    <table>
      <tr><th>Cor (Static Load)</th><td class="form">22 &middot; Z &middot; Lwe &middot; Dw &middot; cos(α)</td><td class="val">${Math.round(C0).toLocaleString()} N</td></tr>
      <tr><th>Cr (Dynamic Load)</th><td class="form">80 &middot; (Lwe &middot; cos(α))<sup>7/9</sup> &middot; Z<sup>3/4</sup> &middot; Dw<sup>29/27</sup></td><td class="val">${Math.round(C).toLocaleString()} N</td></tr>
    </table>
  `;
  document.getElementById('results').innerHTML = html;
}
</script>
</body>
</html>
